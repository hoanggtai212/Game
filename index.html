<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyland — World Map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="world"></main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="close" id="close">×</button>
      <div class="star">★</div>
      <h2 id="modalTitle">Bài 5</h2>
      <p>Đây là điểm bắt đầu của màn chơi. Bạn có thể nối nút này sang game thật sau.</p>
      <button class="play" id="play">Vào bài</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
